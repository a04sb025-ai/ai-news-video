name: Check audio-led renderer

on:
  pull_request:
    paths:
      - "scripts/audio_timing.py"
      - "scripts/narration_tts.py"
      - "scripts/render_adaptive_explainer.py"
      - "scripts/render_adaptive_explainer_fast.py"
      - "tests/test_audio_timing.py"
      - "tests/test_narration_tts.py"
      - "tests/test_render_adaptive_explainer_fast.py"
      - ".github/workflows/check-audio-led-renderer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed renderer modules
        run: |
          python3 -m py_compile             scripts/audio_timing.py             scripts/narration_tts.py             scripts/render_adaptive_explainer.py             scripts/render_adaptive_explainer_fast.py
      - name: Run focused regression tests
        run: |
          python3 -m unittest -v             tests.test_audio_timing             tests.test_narration_tts             tests.test_render_adaptive_explainer_fast
