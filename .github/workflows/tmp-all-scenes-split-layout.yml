name: Temporary all-scenes split-layout patch

on:
  push:
    branches:
      - improve/all-scenes-split-layout
    paths:
      - .github/workflows/tmp-all-scenes-split-layout.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/all-scenes-split-layout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply split text/visual layout to every generated scene
        run: |
          python3 - <<'PY'
          from pathlib import Path

          image_path = Path('scripts/generate_story_images.py')
          image = image_path.read_text()
          body_layout = '''BODY_LAYOUT = (\n    "Body-page split-layout rule: keep the entire lower 42 percent of the canvas as deliberate text-safe negative space, "\n    "using only a calm low-detail continuation of the same background. Do not place any face, person, machine, building, chart, "\n    "focal object, bright highlight, or essential visual evidence in that lower zone. Place the dominant news subject and all important visual evidence "\n    "in the upper portion, concentrated roughly between 8 and 54 percent of the canvas height. "\n    "The renderer places the section label, headline, support copy, and subtitles directly in the reserved lower space, so do not paint a text panel, "\n    "caption card, banner, box, fake UI, or other shape behind text. Keep the result as one continuous full-frame editorial illustration. "\n    "Preserve one-page-one-message: one dominant visual relationship, no collage of unrelated secondary symbols. "\n)\n'''
          if 'BODY_LAYOUT = (' not in image:
              anchor = 'THUMBNAIL_STYLE = {\n'
              if anchor not in image:
                  raise SystemExit('thumbnail style anchor not found')
              image = image.replace(anchor, body_layout + anchor, 1)
          old_prompt = '+ (OPENING_LAYOUT + THUMBNAIL_STYLE.get(thumbnail_style, "") if thumbnail_style else "")'
          new_prompt = '+ ((OPENING_LAYOUT + THUMBNAIL_STYLE.get(thumbnail_style, "")) if thumbnail_style else BODY_LAYOUT)'
          if old_prompt in image:
              image = image.replace(old_prompt, new_prompt, 1)
          elif new_prompt not in image:
              raise SystemExit('prompt layout anchor not found')
          image = image.replace('daily-editorial-v4-split-text-visual', 'daily-editorial-v5-all-scenes-split-text-visual')
          image_path.write_text(image)

          renderer_path = Path('scripts/render_adaptive_explainer.py')
          renderer = renderer_path.read_text()
          if 'BODY_LAYOUT_CONTRACT = "split-text-visual-v1"' not in renderer:
              anchor = 'OPENING_LAYOUT_CONTRACT = "split-text-visual-v1"\n'
              if anchor not in renderer:
                  raise SystemExit('opening layout contract anchor not found')
              renderer = renderer.replace(anchor, anchor + 'BODY_LAYOUT_CONTRACT = "split-text-visual-v1"\n', 1)

          old_body = '''def add_body_page(events, cue, start, end, *, fade=True):\n    if end <= start:\n        return\n    fade_tag = r"\\fad(100,100)" if fade else ""\n    events.append(dialogue(start, end, "Eyebrow", cue["label"], fade_tag, 4))\n    events.append(vector(start, end, rect_path(42, 1110, 996, 620), "101528", rf"\\alpha&H12&{fade_tag}", 4))\n    events.append(dialogue(start, end, "SectionHeadline", cue["caption"], rf"\\pos(90,1170){fade_tag}", 6))\n    events.append(dialogue(start, end, "Support", cue["support_text"], rf"\\pos(90,1360){fade_tag}", 6))\n    events.append(dialogue(start, end, "Subtitle", cue["subtitle"], rf"\\pos(90,1480){fade_tag}", 7))\n'''
          new_body = '''def add_body_page(events, cue, start, end, *, fade=True):\n    \"\"\"Use the generated scene's reserved lower negative space instead of masking the artwork.\"\"\"\n    if end <= start:\n        return\n    fade_tag = r"\\fad(100,100)" if fade else ""\n    events.append(vector(start, end, rect_path(90, 1088, 180, 8), "58D6FF", fade_tag, 4))\n    events.append(dialogue(start, end, "Eyebrow", cue["label"], rf"\\pos(90,1105){fade_tag}", 5))\n    events.append(dialogue(start, end, "SectionHeadline", cue["caption"], rf"\\pos(90,1170){fade_tag}", 6))\n    events.append(dialogue(start, end, "Support", cue["support_text"], rf"\\pos(90,1360){fade_tag}", 6))\n    events.append(dialogue(start, end, "Subtitle", cue["subtitle"], rf"\\pos(90,1480){fade_tag}", 7))\n'''
          if old_body in renderer:
              renderer = renderer.replace(old_body, new_body, 1)
          elif new_body not in renderer:
              raise SystemExit('body-page renderer anchor not found')

          manifest_anchor = '    "opening_generated_image_full_frame": True,\n'
          body_manifest = '''    "body_layout_contract": BODY_LAYOUT_CONTRACT,\n    "body_text_safe_area_ratio": {"top": 0.58, "bottom": 0.91},\n    "body_dominant_visual_area_ratio": {"top": 0.08, "bottom": 0.54},\n    "body_large_overlay_panel": False,\n    "body_generated_image_full_frame": True,\n'''
          if '"body_layout_contract": BODY_LAYOUT_CONTRACT' not in renderer:
              if manifest_anchor not in renderer:
                  raise SystemExit('renderer manifest anchor not found')
              renderer = renderer.replace(manifest_anchor, manifest_anchor + body_manifest, 1)
          renderer_path.write_text(renderer)

          test_path = Path('tests/test_all_scene_split_layout.py')
          test_path.write_text('''import unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass AllSceneSplitLayoutTest(unittest.TestCase):\n    def test_non_opening_images_reserve_lower_text_safe_zone(self):\n        source = (ROOT / "scripts/generate_story_images.py").read_text()\n        self.assertIn("BODY_LAYOUT = (", source)\n        self.assertIn("lower 42 percent", source)\n        self.assertIn("between 8 and 54 percent", source)\n        self.assertIn("else BODY_LAYOUT", source)\n        self.assertIn("one-page-one-message", source)\n        self.assertIn("daily-editorial-v5-all-scenes-split-text-visual", source)\n\n    def test_body_renderer_uses_reserved_space_without_large_overlay(self):\n        renderer = (ROOT / "scripts/render_adaptive_explainer.py").read_text()\n        self.assertNotIn("rect_path(42, 1110, 996, 620)", renderer)\n        self.assertIn('BODY_LAYOUT_CONTRACT = "split-text-visual-v1"', renderer)\n        self.assertIn(r"\\pos(90,1105)", renderer)\n        self.assertIn('"body_large_overlay_panel": False', renderer)\n        self.assertIn('"body_generated_image_full_frame": True', renderer)\n        self.assertIn('"body_text_safe_area_ratio": {"top": 0.58, "bottom": 0.91}', renderer)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          opening_test_path = Path('tests/test_thumbnail_split_layout.py')
          opening_test = opening_test_path.read_text()
          opening_test = opening_test.replace('daily-editorial-v4-split-text-visual', 'daily-editorial-v5-all-scenes-split-text-visual')
          opening_test_path.write_text(opening_test)
          PY

          python3 -m unittest tests.test_thumbnail_split_layout tests.test_all_scene_split_layout tests.test_thumbnail_opening_modes

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_story_images.py scripts/render_adaptive_explainer.py tests/test_thumbnail_split_layout.py tests/test_all_scene_split_layout.py
          git commit -m "Apply split text and visual layout to all scenes"
          git push origin HEAD:improve/all-scenes-split-layout
