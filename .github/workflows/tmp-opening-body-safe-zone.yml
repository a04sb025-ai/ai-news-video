name: Temporary opening body safe-zone patch

on:
  push:
    branches:
      - improve/all-scenes-split-layout
    paths:
      - .github/workflows/tmp-opening-body-safe-zone.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/all-scenes-split-layout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Keep the opening scene visual clear after three seconds
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer_path = Path('scripts/render_adaptive_explainer.py')
          renderer = renderer_path.read_text()
          marker = '\n\ndef add_opening(events, cue):\n'
          function = '''\n\ndef add_opening_body_page(events, cue, start, end):\n    \"\"\"After the thumbnail window, keep copy inside the opening image's top text-safe zone.\"\"\"\n    if end <= start:\n        return\n    fade_tag = r"\\fad(100,100)"\n    events.append(vector(start, end, rect_path(90, 132, 180, 8), "58D6FF", fade_tag, 4))\n    events.append(dialogue(start, end, "Eyebrow", cue["label"], rf"\\pos(90,150){fade_tag}", 5))\n    events.append(dialogue(start, end, "SectionHeadline", cue["caption"], rf"\\pos(90,215)\\fs64{fade_tag}", 6))\n    events.append(dialogue(start, end, "Support", cue["support_text"], rf"\\pos(90,390)\\fs40{fade_tag}", 6))\n    events.append(dialogue(start, end, "Subtitle", cue["subtitle"], rf"\\pos(90,500)\\fs44{fade_tag}", 7))\n'''
          if 'def add_opening_body_page(' not in renderer:
              if marker not in renderer:
                  raise SystemExit('add_opening marker not found')
              renderer = renderer.replace(marker, function + marker, 1)
          old_call = '            add_body_page(events, cue, OPENING_END, end, fade=False)\n'
          new_call = '            add_opening_body_page(events, cue, OPENING_END, end)\n'
          if old_call in renderer:
              renderer = renderer.replace(old_call, new_call, 1)
          elif new_call not in renderer:
              raise SystemExit('opening post-thumbnail call not found')
          renderer_path.write_text(renderer)

          test_path = Path('tests/test_thumbnail_opening_modes.py')
          test = test_path.read_text()
          test = test.replace(
              "self.assertIn('add_body_page(events, cue, OPENING_END, end, fade=False)', renderer)",
              "self.assertIn('add_opening_body_page(events, cue, OPENING_END, end)', renderer)",
          )
          test_path.write_text(test)

          all_scene_test = Path('tests/test_all_scene_split_layout.py')
          test = all_scene_test.read_text()
          needle = '        self.assertIn(\'"body_text_safe_area_ratio": {"top": 0.58, "bottom": 0.91}\', renderer)\n'
          addition = needle + '        self.assertIn("def add_opening_body_page", renderer)\n        self.assertIn("add_opening_body_page(events, cue, OPENING_END, end)", renderer)\n'
          if 'add_opening_body_page(events, cue, OPENING_END, end)' not in test:
              if needle not in test:
                  raise SystemExit('all-scene test insertion anchor not found')
              test = test.replace(needle, addition, 1)
          all_scene_test.write_text(test)
          PY

          python3 -m unittest tests.test_thumbnail_split_layout tests.test_all_scene_split_layout tests.test_thumbnail_opening_modes

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/render_adaptive_explainer.py tests/test_thumbnail_opening_modes.py tests/test_all_scene_split_layout.py
          git commit -m "Keep first scene copy inside its reserved safe zone"
          git push origin HEAD:improve/all-scenes-split-layout
