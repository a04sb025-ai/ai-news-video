name: Render AI news video
on:
  workflow_dispatch:
    inputs:
      render_target:
        description: Video to render
        required: true
        default: teen_chatgpt
        type: choice
        options:
          - teen_chatgpt
          - generic_url
      news_url:
        description: Official URL (required only for generic_url)
        required: false
        type: string
      headline:
        description: Optional verified Japanese headline (used if the page blocks retrieval)
        required: false
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install free media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Fetch and validate latest OpenMontage
        if: inputs.render_target == 'generic_url'
        run: |
          ./scripts/openmontage.sh install
          ./scripts/setup_openmontage.sh
      - name: Restore generated illustration cache
        if: inputs.render_target == 'teen_chatgpt'
        uses: actions/cache@v4
        with:
          path: assets/generated/*.png
          key: teen-illustrations-${{ hashFiles('config/image-generation.json', 'scripts/generate_story_images.py') }}
      - name: Generate ChatGPT for Teens illustrations
        if: inputs.render_target == 'teen_chatgpt'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: make generate-teen-images 2>&1 | tee reports/image-generation.txt
      - name: Prepare URL input
        if: inputs.render_target == 'generic_url'
        env:
          NEWS_URL: ${{ inputs.news_url }}
          HEADLINE: ${{ inputs.headline }}
        run: |
          test -n "$NEWS_URL" || { echo "news_url is required for generic_url" >&2; exit 2; }
          python3 scripts/prepare_story.py "$NEWS_URL" work/story.json "$HEADLINE"
      - name: Render generic 12-second reference video
        if: inputs.render_target == 'generic_url'
        run: python3 scripts/render_reference.py work/story.json dist/ai-news.mp4
      - name: Render ChatGPT for Teens video
        if: inputs.render_target == 'teen_chatgpt'
        run: |
          python3 scripts/check_story_voice.py \
            config/stories/chatgpt-teens-ja.json reports/voice-script-qa.json \
            | tee reports/voice-script-qa.txt
          make render-teen-news
      - name: Opening thumbnail QA and one automatic correction pass
        if: inputs.render_target == 'teen_chatgpt'
        run: |
          set +e
          python3 scripts/check_opening_frames.py \
            dist/chatgpt-teens-ja.mp4 config/stories/chatgpt-teens-ja.json reports/opening \
            | tee reports/opening-qa.txt
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "Opening QA failed; strengthening the headline panel and re-rendering once" | tee -a reports/opening-qa.txt
            OPENING_SAFE_MODE=1 make render-teen-news
            python3 scripts/check_opening_frames.py \
              dist/chatgpt-teens-ja.mp4 config/stories/chatgpt-teens-ja.json reports/opening \
              | tee -a reports/opening-qa.txt
          fi
      - name: Automated QA
        env:
          RENDER_TARGET: ${{ inputs.render_target }}
        run: |
          if [[ "$RENDER_TARGET" == "teen_chatgpt" ]]; then
            VIDEO=dist/chatgpt-teens-ja.mp4
          else
            VIDEO=dist/ai-news.mp4
          fi
          python3 scripts/check_video.py "$VIDEO" | tee reports/qa.txt
          ffmpeg -v error -i "$VIDEO" -f null - 2> reports/decode-errors.txt
          ffmpeg -i "$VIDEO" -vf blackdetect=d=0.3 -an -f null - 2> reports/blackdetect.txt
          ffmpeg -i "$VIDEO" -vf freezedetect=n=-50dB:d=1 -an -f null - 2> reports/freezedetect.txt
          ffmpeg -i "$VIDEO" -af loudnorm=print_format=json -f null - 2> reports/loudness.txt
      - name: Opening thumbnail QA and one automatic correction pass
        if: inputs.render_target == 'teen_chatgpt'
        run: |
          set +e
          python3 scripts/check_opening_frames.py \
            dist/chatgpt-teens-ja.mp4 config/stories/chatgpt-teens-ja.json reports/opening \
            | tee reports/opening-qa.txt
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "Opening QA failed; re-rendering the deterministic safe layout once" | tee -a reports/opening-qa.txt
            rm -f assets/generated/scene-teen-hero.png
            make render-teen-news
            python3 scripts/check_opening_frames.py \
              dist/chatgpt-teens-ja.mp4 config/stories/chatgpt-teens-ja.json reports/opening \
              | tee -a reports/opening-qa.txt
          fi
      - name: Upload video and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-video-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/*.mp4
            reports/**
            work/story.json
            config/stories/chatgpt-teens-ja.json
            assets/generated/*.png
