name: Render AI news video
run-name: ${{ inputs.render_target == 'daily_story' && format('Daily AI news video / {0}', inputs.request_id) || format('AI news video / {0}', inputs.render_target) }}
on:
  workflow_dispatch:
    inputs:
      render_target:
        description: Video to render
        required: true
        default: teen_chatgpt
        type: choice
        options: [teen_chatgpt, daily_story, generic_url]
      request_id:
        description: Safe caller ID (required for daily_story and must match payload)
        required: false
        type: string
      story_payload:
        description: Verified AI Tool Watch JSON brief (required for daily_story)
        required: false
        type: string
      news_url:
        description: Official URL (generic_url only)
        required: false
        type: string
      headline:
        description: Optional verified headline (generic_url only)
        required: false
        type: string
permissions: {contents: read}
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install free media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
      - name: Fetch and validate latest OpenMontage
        if: inputs.render_target == 'generic_url'
        run: ./scripts/openmontage.sh install && ./scripts/setup_openmontage.sh
      - name: Prepare daily verified brief safely
        if: inputs.render_target == 'daily_story'
        env:
          STORY_PAYLOAD: ${{ inputs.story_payload }}
          DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir -p work/daily reports
          printf '%s' "$STORY_PAYLOAD" > work/daily/dispatch-payload.json
          python3 scripts/daily_story.py prepare work/daily/dispatch-payload.json work/daily
          test "$DISPATCH_REQUEST_ID" = "$(python3 -c 'import json; print(json.load(open("work/daily/source-payload.json"))["request_id"])')" || { echo 'request_id input/payload mismatch' >&2; exit 2; }
          echo "VIDEO_FILE=$(cat work/daily/video-filename.txt)" >> "$GITHUB_ENV"
          echo "CONTENT_HASH=$(python3 -c 'import json; print(json.load(open("work/daily/story.json"))["content_hash"])')" >> "$GITHUB_ENV"
      - name: Restore generated illustration cache
        if: inputs.render_target == 'teen_chatgpt' || inputs.render_target == 'daily_story'
        uses: actions/cache@v4
        with:
          path: assets/generated/**
          key: illustrations-${{ inputs.render_target }}-${{ inputs.request_id }}-${{ env.CONTENT_HASH }}-${{ hashFiles('config/image-generation.json', 'scripts/generate_story_images.py') }}
      - name: Generate editorial illustrations
        if: inputs.render_target == 'teen_chatgpt' || inputs.render_target == 'daily_story'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p reports
          if [[ "${{ inputs.render_target }}" == daily_story ]]; then
            status=1
            for attempt in 1 2; do
              echo "Illustration generation attempt ${attempt}/2"
              set +e
              python3 scripts/generate_story_images.py work/daily/story.json 2>&1 | tee -a reports/image-generation.txt
              status=${PIPESTATUS[0]}
              set -e
              [[ "$status" -eq 0 ]] && break
              [[ "$attempt" -lt 2 ]] && sleep 10
            done
            exit "$status"
          else
            make generate-teen-images 2>&1 | tee reports/image-generation.txt
          fi
      - name: Prepare and render generic URL
        if: inputs.render_target == 'generic_url'
        env: {NEWS_URL: "${{ inputs.news_url }}", HEADLINE: "${{ inputs.headline }}"}
        run: |
          test -n "$NEWS_URL" || exit 2
          python3 scripts/prepare_story.py "$NEWS_URL" work/story.json "$HEADLINE"
          python3 scripts/render_reference.py work/story.json dist/ai-news.mp4
      - name: Render structured story
        if: inputs.render_target != 'generic_url'
        run: |
          mkdir -p dist reports
          if [[ "${{ inputs.render_target }}" == daily_story ]]; then
            python3 scripts/check_story_voice.py work/daily/story.json reports/voice-script-qa.json | tee reports/voice-script-qa.txt
            renderer="$(python3 - <<'PY'
          import json
          story=json.load(open('work/daily/story.json'))
          print('scripts/render_explainer.py' if story.get('explanation_contract') == 'four-page-v1' else 'scripts/render_reference.py')
          PY
          )"
            python3 "$renderer" work/daily/story.json "dist/$VIDEO_FILE"
          else
            python3 scripts/check_story_voice.py config/stories/chatgpt-teens-ja.json reports/voice-script-qa.json | tee reports/voice-script-qa.txt
            make render-teen-news
          fi
      - name: Opening and scene QA
        if: inputs.render_target != 'generic_url'
        continue-on-error: true
        run: |
          set +e
          if [[ "${{ inputs.render_target }}" == daily_story ]]; then VIDEO="dist/$VIDEO_FILE"; STORY=work/daily/story.json; else VIDEO=dist/chatgpt-teens-ja.mp4; STORY=config/stories/chatgpt-teens-ja.json; fi
          scripts/opening_qa_with_correction.sh "$VIDEO" "$STORY" reports/opening
          status=$?
          python3 scripts/extract_review_frames.py "$VIDEO" reports/scenes "$STORY"
          exit $status
      - name: Automated video QA
        continue-on-error: true
        run: |
          set +e
          if [[ "${{ inputs.render_target }}" == daily_story ]]; then VIDEO="dist/$VIDEO_FILE"; elif [[ "${{ inputs.render_target }}" == teen_chatgpt ]]; then VIDEO=dist/chatgpt-teens-ja.mp4; else VIDEO=dist/ai-news.mp4; fi
          python3 scripts/check_video.py "$VIDEO" | tee reports/qa.txt
          status=${PIPESTATUS[0]}
          python3 scripts/run_video_qa.py "$VIDEO" reports
          (( status |= $? ))
          ffmpeg -i "$VIDEO" -vf freezedetect=n=-50dB:d=1 -an -f null - 2> reports/freezedetect.txt
          ffmpeg -i "$VIDEO" -af loudnorm=print_format=json -f null - 2> reports/loudness.txt
          exit $status
      - name: Write initial daily automation decision
        if: ${{ always() && inputs.render_target == 'daily_story' }}
        continue-on-error: true
        run: python3 scripts/write_automation_result.py work/daily/story.json "dist/$VIDEO_FILE" reports reports/automation-result.json
      - name: Self-heal recoverable daily video failures
        if: ${{ always() && inputs.render_target == 'daily_story' }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SELF_HEAL_MAX_REPAIRS: "2"
        run: python3 scripts/self_heal_daily_video.py work/daily/story.json "dist/$VIDEO_FILE" reports
      - name: Upload video and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-video-${{ inputs.request_id || inputs.render_target }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/*.mp4
            dist/*.render.json
            reports/**
            work/story.json
            work/daily/**
            config/stories/chatgpt-teens-ja.json
            config/image-generation.json
            assets/generated/**
      - name: Require publishable daily result after repair
        if: ${{ always() && inputs.render_target == 'daily_story' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('reports/automation-result.json')
          if not path.is_file():
              raise SystemExit('Daily automation result is missing after self-heal')
          result=json.loads(path.read_text())
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if result.get('auto_publish_ready') is not True:
              summary=Path('reports/self-heal-summary.json')
              if summary.is_file():
                  print(summary.read_text())
              raise SystemExit('Video remains non-publishable after bounded self-healing')
          print('AUTO PUBLISH READY: true')
          PY
