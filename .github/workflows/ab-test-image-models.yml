name: Compare GPT-Image-2 vs GPT-Image-2.5 Flare
run-name: GPT-Image-2 vs 2.5 Flare / ${{ inputs.request_id || 'cost-benchmark' }}

"on":
  workflow_dispatch:
    inputs:
      story_json_path:
        description: Optional repository-relative prepared story.json path
        required: false
        type: string
      payload_json_path:
        description: Optional repository-relative verified payload JSON path
        required: false
        type: string
      payload_json:
        description: Optional verified payload JSON text
        required: false
        type: string
      request_id:
        description: Optional safe output identifier
        required: false
        type: string
      models:
        description: Comma-separated image models
        required: true
        default: gpt-image-2,gpt-image-2.5-flare
        type: string
      size:
        description: Image size
        required: true
        default: 1024x1536
        type: string
      quality:
        description: Image quality
        required: true
        default: low
        type: string

permissions: {contents: read}

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install preview dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Resolve AB test input
        id: input
        env:
          STORY_PATH: ${{ inputs.story_json_path }}
          PAYLOAD_PATH: ${{ inputs.payload_json_path }}
          INLINE_PAYLOAD: ${{ inputs.payload_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          story = os.environ.get("STORY_PATH", "").strip()
          payload = os.environ.get("PAYLOAD_PATH", "").strip()
          inline = os.environ.get("INLINE_PAYLOAD", "").strip()

          def validate_repo_path(value: str) -> Path:
              path = Path(value)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit("Input path must be repository-relative and must not contain '..'")
              if not path.is_file():
                  raise SystemExit(f"Input file does not exist in the checked-out repository: {value}")
              try:
                  parsed = json.loads(path.read_text())
              except (OSError, json.JSONDecodeError) as error:
                  raise SystemExit(f"Input file is not valid JSON: {error}")
              if not isinstance(parsed, dict):
                  raise SystemExit("Input JSON must be an object")
              return path

          output = Path(os.environ["GITHUB_OUTPUT"])
          if story:
              resolved = validate_repo_path(story)
              with output.open("a") as handle:
                  handle.write(f"story_path={resolved.as_posix()}\n")
                  handle.write("payload_path=\n")
              print(f"Using prepared story: {resolved}")
          elif payload:
              resolved = validate_repo_path(payload)
              with output.open("a") as handle:
                  handle.write("story_path=\n")
                  handle.write(f"payload_path={resolved.as_posix()}\n")
              print(f"Using repository payload: {resolved}")
          else:
              if inline:
                  try:
                      parsed = json.loads(inline)
                  except json.JSONDecodeError as error:
                      raise SystemExit(f"payload_json is not valid JSON: {error}")
                  if not isinstance(parsed, dict):
                      raise SystemExit("payload_json must be a JSON object")
                  print("Using inline payload_json from workflow_dispatch")
              else:
                  parsed = {
                      "request_id": "gpt-image-cost-benchmark",
                      "headline": "AIツールの新しい機能",
                      "summary": "日々の作業を効率化する新機能を紹介します",
                      "hook": "何が変わる？",
                      "image_scenes": [{
                          "role": "hook",
                          "verified_content": "AIツールに新しい機能が追加されたという想定の比較用サンプル",
                          "visual_intent": "新機能によって作業がシンプルになる変化を一つの主役で示す",
                          "key_visuals": ["作業の簡素化", "新しい機能"]
                      }]
                  }
                  print("No custom input supplied; using the built-in cost benchmark payload")
              destination = Path("work/ab-test/dispatch-payload.json")
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(json.dumps(parsed, ensure_ascii=False, indent=2) + "\n")
              with output.open("a") as handle:
                  handle.write("story_path=\n")
                  handle.write(f"payload_path={destination.as_posix()}\n")
          PY
      - name: Generate one key visual per model and capture token usage
        id: generate
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STORY_PATH: ${{ steps.input.outputs.story_path }}
          PAYLOAD_PATH: ${{ steps.input.outputs.payload_path }}
          REQUEST_ID: ${{ inputs.request_id }}
          MODELS: ${{ inputs.models }}
          SIZE: ${{ inputs.size }}
          QUALITY: ${{ inputs.quality }}
        run: |
          args=(--models "$MODELS" --size "$SIZE" --quality "$QUALITY")
          if [[ -n "$STORY_PATH" ]]; then
            args+=(--story-json "$STORY_PATH")
          else
            args+=(--payload-json "$PAYLOAD_PATH")
          fi
          if [[ -n "$REQUEST_ID" ]]; then args+=(--request-id "$REQUEST_ID"); fi
          python3 scripts/compare_image_models_cost.py "${args[@]}"
      - name: Upload comparison images, previews, token log, and cost report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-model-ab-test-${{ inputs.request_id || github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: assets/generated/ab-tests/**
      - name: Write comparison guidance
        if: always()
        run: |
          {
            echo "## GPT image cost comparison"
            echo ""
            echo "- Models: \`${{ inputs.models }}\`"
            echo "- Size: \`${{ inputs.size }}\`"
            echo "- Quality: \`${{ inputs.quality }}\`"
            echo "- This workflow does not change the production model."
            echo ""
            echo "The artifact now contains cost-comparison.json and cost-comparison.md with token usage, elapsed time, and an estimated API cost for each model."
            echo "Dashboard billing remains the source of truth."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require a comparable result
        if: always()
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          if [[ "$GENERATION_OUTCOME" != success ]]; then
            echo "COMPARISON INCOMPLETE: inspect cost-comparison.json in the artifact for per-model errors." >&2
            exit 1
          fi
          echo "COMPARISON COMPLETE: every requested model generated one image and reported usage under identical conditions."
