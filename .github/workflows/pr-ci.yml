name: Pull request CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Unit and static checks
        run: |
          make test
          python3 -m py_compile scripts/*.py tests/*.py
          git diff --check "${{ github.event.pull_request.base.sha }}"
      - name: Install free fallback-render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
      - name: Validate and fallback-render daily fixture without API access
        env:
          OPENAI_API_KEY: ''
        run: |
          mkdir -p work/ci dist reports
          python3 scripts/daily_story.py prepare tests/fixtures/daily-story-valid.json work/ci
          set +e
          python3 scripts/generate_story_images.py work/ci/story.json | tee reports/image-generation.txt
          image_status=${PIPESTATUS[0]}
          set -e
          test "$image_status" -eq 2
          VIDEO="dist/$(cat work/ci/video-filename.txt)"
          python3 scripts/check_story_voice.py work/ci/story.json reports/voice-script-qa.json | tee reports/voice-script-qa.txt
          python3 scripts/render_reference.py work/ci/story.json "$VIDEO"
          scripts/opening_qa_with_correction.sh "$VIDEO" work/ci/story.json reports/opening
          python3 scripts/check_video.py "$VIDEO" | tee reports/qa.txt
          python3 scripts/run_video_qa.py "$VIDEO" reports
          python3 scripts/write_automation_result.py work/ci/story.json "$VIDEO" reports reports/automation-result.json
          python3 - <<'PY'
          import json
          result=json.load(open('reports/automation-result.json'))
          assert result['success'] is True
          assert result['auto_publish_ready'] is False
          assert result['used_generated_images'] is False
          PY
      - name: Fallback-render four-page explainer and verify full subtitles
        env:
          OPENAI_API_KEY: ''
        run: |
          mkdir -p work/ci-rich dist/ci-rich reports/ci-rich
          python3 scripts/daily_story.py prepare tests/fixtures/daily-story-four-page-valid.json work/ci-rich
          set +e
          python3 scripts/generate_story_images.py work/ci-rich/story.json | tee reports/ci-rich/image-generation.txt
          image_status=${PIPESTATUS[0]}
          set -e
          test "$image_status" -eq 2
          VIDEO="dist/ci-rich/$(cat work/ci-rich/video-filename.txt)"
          python3 scripts/check_story_voice.py work/ci-rich/story.json reports/ci-rich/voice-script-qa.json | tee reports/ci-rich/voice-script-qa.txt
          python3 scripts/render_explainer.py work/ci-rich/story.json "$VIDEO"
          scripts/opening_qa_with_correction.sh "$VIDEO" work/ci-rich/story.json reports/ci-rich/opening
          python3 scripts/check_video.py "$VIDEO" work/ci-rich/story.json | tee reports/ci-rich/qa.txt
          python3 scripts/run_video_qa.py "$VIDEO" reports/ci-rich
          python3 scripts/write_automation_result.py work/ci-rich/story.json "$VIDEO" reports/ci-rich reports/ci-rich/automation-result.json
          python3 - <<'PY'
          import json
          story=json.load(open('work/ci-rich/story.json'))
          result=json.load(open('reports/ci-rich/automation-result.json'))
          voice=json.load(open('reports/ci-rich/voice-script-qa.json'))
          manifest=json.load(open('dist/ci-rich/' + open('work/ci-rich/video-filename.txt').read().strip().replace('.mp4','.render.json')))
          assert story['explanation_contract'] == 'four-page-v1'
          assert voice['checks']['subtitles_cover_full_narration'] is True
          assert manifest['full_narration_subtitles'] is True
          assert result['success'] is True
          assert result['auto_publish_ready'] is False
          assert result['used_generated_images'] is False
          PY
      - name: Fallback-render adaptive explainer and verify mobile readability contract
        env:
          OPENAI_API_KEY: ''
        run: |
          mkdir -p work/ci-adaptive dist/ci-adaptive reports/ci-adaptive
          python3 scripts/adaptive_daily_story.py prepare tests/fixtures/daily-story-adaptive-valid.json work/ci-adaptive
          set +e
          python3 scripts/generate_story_images.py work/ci-adaptive/story.json | tee reports/ci-adaptive/image-generation.txt
          image_status=${PIPESTATUS[0]}
          set -e
          test "$image_status" -eq 2
          VIDEO="dist/ci-adaptive/$(cat work/ci-adaptive/video-filename.txt)"
          python3 scripts/check_story_voice.py work/ci-adaptive/story.json reports/ci-adaptive/voice-script-qa.json | tee reports/ci-adaptive/voice-script-qa.txt
          python3 scripts/render_adaptive_explainer.py work/ci-adaptive/story.json "$VIDEO"
          scripts/opening_qa_with_correction.sh "$VIDEO" work/ci-adaptive/story.json reports/ci-adaptive/opening
          python3 scripts/check_adaptive_video.py "$VIDEO" work/ci-adaptive/story.json | tee reports/ci-adaptive/qa.txt
          python3 scripts/run_video_qa.py "$VIDEO" reports/ci-adaptive
          python3 scripts/write_adaptive_result.py work/ci-adaptive/story.json "$VIDEO" reports/ci-adaptive reports/ci-adaptive/automation-result.json
          python3 - <<'PY'
          import json
          story=json.load(open('work/ci-adaptive/story.json'))
          result=json.load(open('reports/ci-adaptive/automation-result.json'))
          voice=json.load(open('reports/ci-adaptive/voice-script-qa.json'))
          manifest=json.load(open('dist/ci-adaptive/' + open('work/ci-adaptive/video-filename.txt').read().strip().replace('.mp4','.render.json')))
          assert story['explanation_contract'] == 'adaptive-pages-v1'
          assert story['adaptive_page_count'] == 5
          assert story['expected_duration_seconds'] > 25
          assert all(len(line) <= 9 for line in story['script'][0]['caption'].splitlines())
          assert story['opening']['thumbnail_style_contract'] == 'A-breaking-B-magazine-C-declarative'
          assert voice['checks']['subtitles_cover_full_narration'] is True
          assert manifest['renderer'] == 'adaptive-explainer-v3-shorts-safe'
          assert manifest['subtitle_font_size_px'] >= 48
          assert manifest['opening_headline_target_chars_per_line'] <= 10
          assert manifest['youtube_shorts_ui_exclusion_px']['bottom'] == 576
          assert manifest['youtube_shorts_ui_exclusion_px']['right'] == 192
          assert manifest['body_text_safe_area_px'] == {'left': 72, 'right': 888, 'top': 742, 'bottom': 1328}
          assert result['success'] is True
          assert result['auto_publish_ready'] is False
          assert result['used_generated_images'] is False
          PY
      - name: Smoke-render October 15 three-poster trial without any image API calls
        env:
          OPENAI_API_KEY: ''
        run: |
          mkdir -p work/ci-poster dist/ci-poster
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('tests/fixtures/daily-story-adaptive-valid.json').read_text())
          payload['request_id'] = 'daily-news-2026-10-15-ci-test'
          Path('work/ci-poster/input.json').write_text(json.dumps(payload, ensure_ascii=False))
          PY
          python3 scripts/adaptive_daily_story.py prepare work/ci-poster/input.json work/ci-poster
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          story = json.loads(Path('work/ci-poster/story.json').read_text())
          assert story['production_profile'] == 'three-poster-infographic-trial-v1'
          assets = Path(story['image_asset_dir'])
          assets.mkdir(parents=True, exist_ok=True)
          for filename in ['opening-thumbnail.png', *story['image_assets']]:
              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                  '-f', 'lavfi', '-i', 'color=c=0x1b2c42:s=864x1536',
                  '-frames:v', '1', str(assets / filename)
              ], check=True)
          PY
          VIDEO="dist/ci-poster/$(cat work/ci-poster/video-filename.txt)"
          python3 scripts/render_adaptive_explainer.py work/ci-poster/story.json "$VIDEO"
          python3 scripts/check_adaptive_video.py "$VIDEO" work/ci-poster/story.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          story = json.loads(Path('work/ci-poster/story.json').read_text())
          filename = Path('work/ci-poster/video-filename.txt').read_text().strip()
          manifest = json.loads((Path('dist/ci-poster') / filename.replace('.mp4', '.render.json')).read_text())
          assert manifest['three_poster_infographic_trial'] is True
          assert manifest['poster_count'] == 3
          assert manifest['opening_visual_hold_seconds'] >= 3
          assert len(manifest['poster_page_groups']) == 2
          assert manifest['used_generated_images'] is True
          PY
