name: Pull request CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Unit and static checks
        run: |
          make test
          python3 -m py_compile scripts/*.py tests/*.py
          git diff --check "${{ github.event.pull_request.base.sha }}"
      - name: Install free fallback-render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
      - name: Validate and fallback-render daily fixture without API access
        env:
          OPENAI_API_KEY: ''
        run: |
          mkdir -p work/ci dist reports
          python3 scripts/daily_story.py prepare tests/fixtures/daily-story-valid.json work/ci
          set +e
          python3 scripts/generate_story_images.py work/ci/story.json | tee reports/image-generation.txt
          image_status=${PIPESTATUS[0]}
          set -e
          test "$image_status" -eq 2
          VIDEO="dist/$(cat work/ci/video-filename.txt)"
          python3 scripts/check_story_voice.py work/ci/story.json reports/voice-script-qa.json | tee reports/voice-script-qa.txt
          python3 scripts/render_reference.py work/ci/story.json "$VIDEO"
          scripts/opening_qa_with_correction.sh "$VIDEO" work/ci/story.json reports/opening
          python3 scripts/check_video.py "$VIDEO" | tee reports/qa.txt
          python3 scripts/run_video_qa.py "$VIDEO" reports
          python3 scripts/write_automation_result.py work/ci/story.json "$VIDEO" reports reports/automation-result.json
          python3 - <<'PY'
          import json
          result=json.load(open('reports/automation-result.json'))
          assert result['success'] is True
          assert result['auto_publish_ready'] is False
          assert result['used_generated_images'] is False
          PY
      - name: Fallback-render four-page explainer and verify full subtitles
        env:
          OPENAI_API_KEY: ''
        run: |
          mkdir -p work/ci-rich dist/ci-rich reports/ci-rich
          python3 scripts/daily_story.py prepare tests/fixtures/daily-story-four-page-valid.json work/ci-rich
          set +e
          python3 scripts/generate_story_images.py work/ci-rich/story.json | tee reports/ci-rich/image-generation.txt
          image_status=${PIPESTATUS[0]}
          set -e
          test "$image_status" -eq 2
          VIDEO="dist/ci-rich/$(cat work/ci-rich/video-filename.txt)"
          python3 scripts/check_story_voice.py work/ci-rich/story.json reports/ci-rich/voice-script-qa.json | tee reports/ci-rich/voice-script-qa.txt
          python3 scripts/render_explainer.py work/ci-rich/story.json "$VIDEO"
          scripts/opening_qa_with_correction.sh "$VIDEO" work/ci-rich/story.json reports/ci-rich/opening
          python3 scripts/check_video.py "$VIDEO" work/ci-rich/story.json | tee reports/ci-rich/qa.txt
          python3 scripts/run_video_qa.py "$VIDEO" reports/ci-rich
          python3 scripts/write_automation_result.py work/ci-rich/story.json "$VIDEO" reports/ci-rich reports/ci-rich/automation-result.json
          python3 - <<'PY'
          import json
          story=json.load(open('work/ci-rich/story.json'))
          result=json.load(open('reports/ci-rich/automation-result.json'))
          voice=json.load(open('reports/ci-rich/voice-script-qa.json'))
          manifest=json.load(open('dist/ci-rich/' + open('work/ci-rich/video-filename.txt').read().strip().replace('.mp4','.render.json')))
          assert story['explanation_contract'] == 'four-page-v1'
          assert voice['checks']['subtitles_cover_full_narration'] is True
          assert manifest['full_narration_subtitles'] is True
          assert result['success'] is True
          assert result['auto_publish_ready'] is False
          assert result['used_generated_images'] is False
          PY
